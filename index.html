
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="/favicon.ico" type="image/x-icon" />
    <title>Mudra Clinic - Staff Portal</title>
    <meta name="description" content="Mudra Clinic Staff Portal for Dental Metrix and Meditouch Clinics" />
    <meta name="author" content="Mudra Clinic" />

    <meta property="og:title" content="Mudra Clinic Staff Portal" />
    <meta property="og:description" content="Internal portal for Dental Metrix and Meditouch operations" />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="/logo.png" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:site" content="@MudraClinic" />
    <meta name="twitter:image" content="/logo.png" />
  </head>

  <body>
    <div id="root"></div>

    <script type="module" src="/src/main.tsx"></script>
    <script>
      // Heartbeat: reload page when the server goes down so the browser shows "can't connect"
      (function() {
        var failures = 0;
        setInterval(function() {
          fetch('/api/health', { method: 'GET' })
            .then(function(r) {
              if (r.ok) { failures = 0; } else { failures++; if (failures >= 2) location.reload(); }
            })
            .catch(function() {
              failures++;
              if (failures >= 2) location.reload();
            });
        }, 3000);
      })();
    </script>
  </body>
</html>
